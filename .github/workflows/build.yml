name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s $(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          xcodebuild -version

      - name: Setup project
        run: |
          cp "setup and build.py" s.py
          python3 s.py

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project 3105.xcodeproj \
            -scheme 3105 \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_HARDENED_RUNTIME=NO \
            OTHER_LDFLAGS="-Wl,-undefined,dynamic_lookup" \
            PRODUCT_BUNDLE_IDENTIFIER="com.apple.mobile.MobileHouseArrest" \
            PRODUCT_MODULE_NAME="App3105" \
            IPHONEOS_DEPLOYMENT_TARGET=16.0 \
            ONLY_ACTIVE_ARCH=NO \
            GCC_ENABLE_OBJC_ARC=YES \
            CLANG_ENABLE_MODULES=YES \
            clean build \
            -derivedDataPath build/DerivedData \
            2>&1 | tee build.log || true
          echo "=== ERRORS ==="
          grep "error:" build.log | head -30 || true
          tail -5 build.log
          grep -q "BUILD SUCCEEDED" build.log || exit 1

      - name: Package IPA
        run: |
          APP=$(find build/DerivedData -name "3105.app" -type d | head -1)
          echo "Found: $APP"
          ls -la "$APP"
          mkdir -p Payload
          cp -r "$APP" Payload/3105.app
          zip -r 3105-unsigned.ipa Payload/
          ls -lh 3105-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: 3105-unsigned-ipa
          path: 3105-unsigned.ipa
          retention-days: 7
