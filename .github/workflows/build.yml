name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 15.4
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Setup project (write sources + generate xcodeproj)
        run: python3 "setup and build.py"

      - name: Build
        run: |
          xcodebuild \
            -project 3105.xcodeproj \
            -scheme 3105 \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_HARDENED_RUNTIME=NO \
            OTHER_LDFLAGS="-lsystem_containermanager" \
            SWIFT_OBJC_BRIDGING_HEADER="Sources/3105-Bridging-Header.h" \
            PRODUCT_BUNDLE_IDENTIFIER="com.apple.mobile.MobileHouseArrest" \
            IPHONEOS_DEPLOYMENT_TARGET=16.0 \
            ONLY_ACTIVE_ARCH=NO \
            clean build \
            -derivedDataPath build/DerivedData \
            | xcpretty || true

      - name: Package IPA
        run: |
          APP=$(find build/DerivedData -name "3105.app" -type d | head -1)
          echo "App found: $APP"
          mkdir -p Payload
          cp -r "$APP" Payload/3105.app
          zip -r 3105-unsigned.ipa Payload/
          ls -lh 3105-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: 3105-unsigned-ipa
          path: 3105-unsigned.ipa
          retention-days: 7
