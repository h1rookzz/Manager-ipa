name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.3.app

      - name: Setup project
        run: python3 "setup and build.py"

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -scheme 3105 \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath DerivedData \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS="arm64" \
            EXCLUDED_ARCHS="x86_64 i386" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ENABLE_HARDENED_RUNTIME=NO \
            SKIP_INSTALL=NO \
            build 2>&1 | tee build.log | grep -E "error:|BUILD FAILED|BUILD SUCCEEDED" | head -50
          if grep -q "BUILD FAILED" build.log; then
            echo "=== FULL ERROR LOG ==="
            grep -E "error:|warning:" build.log | head -80
            exit 1
          fi

      - name: Package IPA
        run: |
          APP=$(find DerivedData/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 | head -1)
          if [ -z "$APP" ]; then
            APP=$(find DerivedData/Build/Products -name "*.app" -maxdepth 3 | head -1)
          fi
          echo "App: $APP"
          mkdir -p Payload
          cp -r "$APP" Payload/3105.app
          zip -qr 3105.ipa Payload/
          ls -lh 3105.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: 3105-ipa
          path: 3105.ipa
