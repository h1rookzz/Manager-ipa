name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 15.4
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Setup project
        run: |
          cp "setup and build.py" s.py
          python3 s.py

      - name: Find containermanager
        run: |
          find /Applications/Xcode_15.4.app -name "*containermanager*" 2>/dev/null || true
          find /Library/Developer -name "*containermanager*" 2>/dev/null || true

      - name: Build
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          CM_LIB=$(find "$SDK_PATH" -name "libsystem_containermanager*" 2>/dev/null | head -1)
          if [ -n "$CM_LIB" ]; then
            CM_DIR=$(dirname "$CM_LIB")
            LDFLAGS="-L$CM_DIR -lsystem_containermanager"
          else
            LDFLAGS="-lsystem_containermanager"
          fi
          echo "Using LDFLAGS: $LDFLAGS"
          xcodebuild \
            -project 3105.xcodeproj \
            -scheme 3105 \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_HARDENED_RUNTIME=NO \
            OTHER_LDFLAGS="$LDFLAGS" \
            SWIFT_OBJC_BRIDGING_HEADER="Sources/3105-Bridging-Header.h" \
            PRODUCT_BUNDLE_IDENTIFIER="com.apple.mobile.MobileHouseArrest" \
            IPHONEOS_DEPLOYMENT_TARGET=16.0 \
            ONLY_ACTIVE_ARCH=NO \
            clean build \
            -derivedDataPath build/DerivedData

      - name: Find app
        run: |
          find build/DerivedData -name "3105.app" -type d
          APP=$(find build/DerivedData -name "3105.app" -type d | head -1)
          echo "APP=$APP" >> $GITHUB_ENV

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r "$APP" Payload/3105.app
          zip -r 3105-unsigned.ipa Payload/
          ls -lh 3105-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: 3105-unsigned-ipa
          path: 3105-unsigned.ipa
          retention-days: 7
