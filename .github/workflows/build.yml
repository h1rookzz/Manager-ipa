name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 15.4
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Setup project
        run: |
          cp "setup and build.py" s.py
          python3 s.py

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project 3105.xcodeproj \
            -scheme 3105 \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_HARDENED_RUNTIME=NO \
            OTHER_LDFLAGS="-Wl,-undefined,dynamic_lookup" \
            PRODUCT_BUNDLE_IDENTIFIER="com.apple.mobile.MobileHouseArrest" \
            PRODUCT_MODULE_NAME="App3105" \
            IPHONEOS_DEPLOYMENT_TARGET=16.0 \
            ONLY_ACTIVE_ARCH=NO \
            clean build \
            -derivedDataPath build/DerivedData \
            2>&1 | tee build_full.log
          grep "error:" build_full.log | head -20 || true
          tail -3 build_full.log

      - name: Package IPA
        run: |
          APP=$(find build/DerivedData -name "3105.app" -type d | head -1)
          echo "Found: $APP"
          echo "=== App contents ==="
          ls -lah "$APP"
          echo "=== App size ==="
          du -sh "$APP"
          
          mkdir -p Payload
          cp -r "$APP" Payload/3105.app
          echo "=== Payload contents ==="
          ls -lah Payload/3105.app
          
          zip -r 3105-unsigned.ipa Payload/
          ls -lh 3105-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: 3105-unsigned-ipa
          path: 3105-unsigned.ipa
          retention-days: 7
