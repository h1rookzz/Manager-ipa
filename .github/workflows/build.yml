name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.3.app

      - name: Setup project
        run: python3 "setup and build.py"

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project KERNEL.xcodeproj \
            -scheme KERNEL \
            -configuration TgtRelease \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ENABLE_HARDENED_RUNTIME=NO \
            build 2>&1 | grep -E "error:|BUILD FAILED|BUILD SUCCEEDED|warning: " | head -80

      - name: Package IPA
        run: |
          APP=$(find DerivedData/Build/Products -maxdepth 3 -name "*.app" | head -1)
          echo "App: $APP"
          test -n "$APP"
          mkdir -p Payload
          cp -r "$APP" Payload/KERNEL.app
          zip -qr KERNEL.ipa Payload/
          ls -lh KERNEL.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: KERNEL-ipa
          path: KERNEL.ipa
