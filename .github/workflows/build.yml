name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.3.app

      - name: Setup project
        run: python3 "setup and build.py"

      - name: Build
        run: |
          xcodebuild \
            -project 3105.xcodeproj \
            -scheme 3105 \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ENABLE_HARDENED_RUNTIME=NO \
            OTHER_LDFLAGS="-Wl,-undefined,dynamic_lookup" \
            build 2>&1 | grep -E "error:|warning:|BUILD|FAILED|SUCCEEDED" | tail -50

      - name: Package IPA
        run: |
          APP=$(find DerivedData/Build/Products -name "*.app" -maxdepth 2 | head -1)
          echo "App: $APP"
          ls -la "$APP"
          mkdir -p Payload
          cp -r "$APP" Payload/3105.app
          zip -qr 3105.ipa Payload/
          ls -lh 3105.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: 3105-ipa
          path: 3105.ipa
