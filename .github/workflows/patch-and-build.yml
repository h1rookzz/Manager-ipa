name: Patch and Build

on:
  workflow_dispatch:

jobs:
  patch-and-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Patch MHAContainerService
        run: |
          python3 - << 'PYEOF'
import base64, re

NEW_B64 = ""

with open("setup and build.py", "r") as f:
    content = f.read()

key = "'Sources/Services/MHAContainerService.swift'"
idx = content.find(key)
if idx < 0:
    raise Exception("Key not found")

after_key = content[idx + len(key):]
colon = after_key.find(':')
q1 = after_key.find("'", colon) + 1
q2 = after_key.find("'", q1)

old_b64 = after_key[q1:q2]
print(f"Old b64 len: {len(old_b64)}")
print(f"New b64 len: {len(NEW_B64)}")

new_content = content.replace("'" + old_b64 + "'", "'" + NEW_B64 + "'", 1)
if new_content == content:
    raise Exception("Replace failed")

with open("setup and build.py", "w") as f:
    f.write(new_content)
print("Patched!")
PYEOF

      - name: Run setup and build
        run: python3 "setup and build.py"

      - name: Build IPA
        run: |
          set -e
          cd 3105.xcodeproj/..
          xcodebuild \
            -project 3105.xcodeproj \
            -scheme 3105 \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ENABLE_HARDENED_RUNTIME=NO \
            OTHER_LDFLAGS="-Wl,-undefined,dynamic_lookup" \
            build

      - name: Package IPA
        run: |
          APP=$(find DerivedData -name "*.app" | head -1)
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -r 3105.ipa Payload/
          ls -lh 3105.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: 3105-ipa
          path: 3105.ipa
